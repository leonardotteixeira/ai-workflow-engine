name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # Never set OPENAI_API_KEY here — the entire test suite runs against
      # LLM_PROVIDER=mock / a mocked httpx transport (tests/test_providers_openai.py),
      # so no real LLM call is ever made in CI (DESIGN.md §17, Fase 12 §12.4).
      LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: mypy --strict
        run: mypy
      - name: pytest + coverage
        run: pytest --cov=workflow_engine --cov-report=term-missing --cov-fail-under=95

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
